<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Artem vs Production Server 🐻</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: black;
  color: #00ff9f;
  overflow: hidden;
}

/* MATRIX */
#matrix {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* TERMINAL */
#terminal {
  position: fixed;
  inset: 0;
  background: black;
  color: #00ff9f;
  padding: 20px;
  z-index: 10;
}

#terminalText { white-space: pre-line; }

#inputLine { margin-top: 10px; }

#commandInput {
  background: black;
  border: none;
  color: #00ff9f;
  outline: none;
  font-family: monospace;
}

/* INTRO */
#intro {
  display: none;
  position: fixed;
  inset: 0;
  background: black;
  color: #00ff9f;
  z-index: 20;
  padding: 20px;
}

/* GAME */
#app {
  display: none;
  position: relative;
  z-index: 2;
  padding: 20px;
}

#battle {
  margin-top: 20px;
  border: 1px solid #00ff9f55;
  padding: 10px;
}

.card {
  display: inline-block;
  margin: 5px;
  padding: 8px;
  border: 1px solid #00ff9f55;
  cursor: pointer;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<!-- TERMINAL -->
<div id="terminal">
  <div id="terminalText"></div>
  <div id="inputLine" style="display:none;">
    > <input id="commandInput" autocomplete="off" />
  </div>
</div>

<!-- INTRO -->
<div id="intro">
  <h2>📘 Инструкция</h2>
  <pre>
🐻 Artem vs Production Server

Цель:
- уничтожить сервер карточками
- но сначала нужно собрать debug энергию

Как играть:
- лови 🐛 баги кликом
- набери 5 debug points
- потом откроется бой

Удачи, dev.
  </pre>

  <button id="startCatch">START DEBUG MODE</button>
</div>

<!-- GAME -->
<div id="app">
  <h1>🐻 Artem vs Production Server</h1>

  <div id="battle">
    <p>Artem HP: <span id="playerHp">20</span></p>
    <p>Boss HP: <span id="enemyHp">40</span></p>
    <p>Mana: <span id="mana">1</span></p>
    <p>Shield: <span id="shield">0</span></p>

    <hr>

    <div id="hand"></div>
    <button id="endTurn">End Turn</button>
  </div>
</div>

<script>

/* MATRIX */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = Array.from({ length: columns }).fill(1);

function matrix(){
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#00ff9f";
  ctx.font = fontSize + "px monospace";

  drops.forEach((y,i)=>{
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, y*fontSize);

    if(y*fontSize > canvas.height && Math.random()>0.975){
      drops[i]=0;
    }
    drops[i]++;
  });
}

setInterval(matrix, 33);

/* STATE */
let gameState = "terminal";
let debugPoints = 0;

/* TERMINAL */
const terminal = document.getElementById("terminal");
const terminalText = document.getElementById("terminalText");
const input = document.getElementById("commandInput");
const inputLine = document.getElementById("inputLine");

const lines = [
  "Booting Artem System...",
  "Loading modules...",
  "Detecting user: Артём",
  "Connecting to Production Server...",
  "⚠️ Critical bugs detected",
  "",
  "Type 'start' to begin"
];

let i = 0;

function type(){
  if(i < lines.length){
    terminalText.innerText += lines[i] + "\n";
    i++;
    setTimeout(type, 400);
  } else {
    inputLine.style.display = "block";
    input.focus();
  }
}
type();

input.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    const cmd = input.value.trim().toLowerCase();
    terminalText.innerText += "> " + cmd + "\n";

    if(cmd === "start"){
      terminalText.innerText += "Launching...\n";

      setTimeout(()=>{
        terminal.style.display = "none";
        document.getElementById("intro").style.display = "block";
        gameState = "intro";
      }, 600);
    } else {
      terminalText.innerText += "command not found\n";
    }

    input.value = "";
  }
});

/* INTRO */
document.getElementById("startCatch").onclick = ()=>{
  document.getElementById("intro").style.display = "none";
  startBugGame();
};

/* BUG GAME */
function startBugGame(){
  gameState = "catch";
  spawnBug();
  checkStartBattle();
}

function spawnBug(){
  if(gameState !== "catch") return;

  const bug = document.createElement("div");
  bug.innerText = "🐛";
  bug.style.position = "absolute";
  bug.style.left = Math.random()*window.innerWidth + "px";
  bug.style.top = Math.random()*window.innerHeight + "px";
  bug.style.fontSize = "24px";
  bug.style.cursor = "pointer";
  bug.style.zIndex = 999;

  bug.onclick = ()=>{
    debugPoints++;
    bug.remove();
  };

  document.body.appendChild(bug);

  setTimeout(()=>bug.remove(), 1500);
  setTimeout(spawnBug, 350);
}

function checkStartBattle(){
  if(debugPoints >= 5){
    gameState = "battle";
    document.getElementById("app").style.display = "block";
    startGame();
  } else {
    setTimeout(checkStartBattle, 500);
  }
}

/* BOSS */
let playerHp = 20;

let enemy = {
  hp: 40,
  maxHp: 40,
  shield: 0,
  phase: 1
};

let mana = 1;
let turn = 1;

/* UI */
const playerHpEl = document.getElementById("playerHp");
const enemyHpEl = document.getElementById("enemyHp");
const manaEl = document.getElementById("mana");
const shieldEl = document.getElementById("shield");
const hand = document.getElementById("hand");
const endTurn = document.getElementById("endTurn");

/* DECK */
const deck = [
  { name:"🐛 Bug Fix", cost:1, dmg:2 },
  { name:"🔥 Hotfix", cost:2, dmg:4 },
  { name:"💀 Leak", cost:3, dmg:6 },
  { name:"🔄 Rollback", cost:2, dmg:3 },
  { name:"💙 Dev Blessing", cost:4, dmg:10 }
];

function startGame(){
  draw();
  update();
}

function draw(){
  hand.innerHTML = "";

  deck.forEach(card=>{
    const el = document.createElement("div");
    el.className = "card";
    el.innerText = `${card.name} (${card.cost})`;
    el.onclick = ()=>play(card);
    hand.appendChild(el);
  });
}

function play(card){
  if(mana < card.cost) return;

  mana -= card.cost;

  let dmg = card.dmg;

  if(enemy.shield > 0){
    const blocked = Math.min(enemy.shield, dmg);
    enemy.shield -= blocked;
    dmg -= blocked;
  }

  enemy.hp -= dmg;

  update();

  if(enemy.hp <= 0){
    document.body.innerHTML = "<h1 style='color:#00ff9f'>🎉 BOSS DEFEATED</h1>";
  }
}

function enemyTurn(){

  if(enemy.hp <= enemy.maxHp/2 && enemy.phase === 1){
    enemy.phase = 2;
    enemy.shield = 5;
  }

  let dmg = enemy.phase === 1
    ? 2 + Math.floor(turn/3)
    : 5 + Math.floor(turn/2);

  playerHp -= dmg;

  update();

  if(playerHp <= 0){
    document.body.innerHTML = "<h1 style='color:red'>💀 GAME OVER</h1>";
  }
}

endTurn.onclick = ()=>{
  turn++;
  mana += 2;
  enemyTurn();
  draw();
  update();
};

function update(){
  playerHpEl.innerText = playerHp;
  enemyHpEl.innerText = enemy.hp;
  manaEl.innerText = mana;
  shieldEl.innerText = enemy.shield;
}

</script>

</body>
</html>
