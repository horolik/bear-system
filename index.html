<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Bear System 🐻</title>

<style>
body {
 margin: 0;
 font-family: monospace;
 background: black;
 color: #00ff9f;
 overflow: hidden;
}

/* TERMINAL */
#terminal {
 position: fixed;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 background: black;
 color: #00ff9f;
 padding: 20px;
 z-index: 2;
 font-size: 14px;
}

#terminalText {
 white-space: pre-line;
}

#commandInput {
 background: black;
 border: none;
 color: #00ff9f;
 outline: none;
 font-family: monospace;
}

/* APP */
#app {
 padding: 20px;
 position: relative;
 z-index: 1;
}

h1 {
 text-shadow: 0 0 10px #00ff9f;
}

button {
 padding: 10px;
 background: black;
 border: 1px solid #00ff9f;
 color: #00ff9f;
 cursor: pointer;
}

#game {
 margin-top: 20px;
 height: 300px;
 border: 1px dashed #00ff9f55;
 position: relative;
 overflow: hidden;
}

.item {
 position: absolute;
 background: black;
 padding: 5px 8px;
 border: 1px solid #00ff9f55;
 cursor: pointer;
}

/* MATRIX */
#matrix {
 position: fixed;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 z-index: 0;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<!-- TERMINAL -->
<div id="terminal">
  <div id="terminalText"></div>
  <div id="inputLine" style="display:none;">
    <span>> </span>
    <input id="commandInput" autofocus />
  </div>
</div>

<!-- GAME -->
<div id="app">
<h1>🐻 Bear Debug System</h1>
<button id="startBtn">START FIX MODE</button>
<p>Score: <span id="score">0</span> | HP: <span id="hp">3</span></p>
<div id="log" style="color:#22c55e;margin:10px 0;"></div>
<div id="game"></div>
</div>

<script>
const devName = "Артём";

let score = 0;
let hp = 3;
let started = false;
let interval;

const game = document.getElementById("game");
const scoreEl = document.getElementById("score");
const hpEl = document.getElementById("hp");
const log = document.getElementById("log");

const sound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

/* TERMINAL LOGIC */
const terminal = document.getElementById("terminal");
const terminalText = document.getElementById("terminalText");
const inputLine = document.getElementById("inputLine");
const input = document.getElementById("commandInput");

const lines = [
  "Booting Bear System...",
  "Loading modules...",
  "Initializing developer profile...",
  "User detected: Артём",
  "Scanning for bugs...",
  "⚠️ Critical bugs detected",
  "",
  "Type 'start' to begin"
];

let i = 0;

function typeLine() {
 if (i < lines.length) {
   terminalText.innerText += lines[i] + "\n";
   i++;
   setTimeout(typeLine, 600);
 } else {
   inputLine.style.display = "block";
   input.focus();
 }
}

typeLine();

input.addEventListener("keydown", function(e) {
 if (e.key === "Enter") {
   const cmd = input.value.trim().toLowerCase();

   terminalText.innerText += "> " + cmd + "\n";

   if (cmd === "start") {
     terminal.innerText += "\nLaunching debug mode...\n";

     setTimeout(() => {
       terminal.style.display = "none";
       document.getElementById("startBtn").click();
     }, 900);
   } else {
     terminalText.innerText += "command not found\n";
   }

   input.value = "";
 }
});

/* GAME */
document.getElementById("startBtn").onclick = function () {
 if (started) return;
 started = true;

 log.innerText = `👨‍💻 ${devName}, fix the bugs`;

 spawn();
 interval = setInterval(spawn, 800);
};

function update() {
 scoreEl.innerText = score;
 hpEl.innerText = hp;
}

function win() {
 clearInterval(interval);
 game.innerHTML = `
   <h2>✔ BUILD SUCCESS</h2>
   <p>${devName}, ты пофиксил все баги.</p>
   <p>🎁 Теперь открой подарок:</p>
   <a href="https://your-link-here.com" target="_blank" style="color:#00ff9f;">
     открыть
   </a>
 `;
}

function spawn() {
 const item = document.createElement("div");
 item.className = "item";
 const r = Math.random();

 if (r < 0.1) {
   item.innerText = "🔥 CRITICAL BUG";
   item.onclick = () => {
     sound.play();
     score += 5;
     item.remove();
     update();
     if (score >= 20) win();
   };
 } else if (r < 0.7) {
   item.innerText = "🐻 BEAR BUG";
   item.onclick = () => {
     sound.play();
     score++;
     item.remove();
     update();
     if (score >= 20) win();
   };
 } else {
   item.innerText = "⏰ deadline";
   item.onclick = () => {
     sound.play();
     hp--;
     item.remove();
     update();
     if (hp <= 0) {
       alert("💀 game over");
       location.reload();
     }
   };
 }

 item.style.left = Math.random() * 80 + "%";
 item.style.top = Math.random() * 80 + "%";

 game.appendChild(item);
 setTimeout(() => item.remove(), 2500);
}

/* MATRIX */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;

const drops = Array.from({ length: columns }).fill(1);

function drawMatrix() {
 ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
 ctx.fillRect(0, 0, canvas.width, canvas.height);

 ctx.fillStyle = "#00ff9f";
 ctx.font = fontSize + "px monospace";

 drops.forEach((y, i) => {
   const text = letters[Math.floor(Math.random() * letters.length)];
   ctx.fillText(text, i * fontSize, y * fontSize);

   if (y * fontSize > canvas.height && Math.random() > 0.975) {
     drops[i] = 0;
   }

   drops[i]++;
 });
}

setInterval(drawMatrix, 33);
</script>

</body>
</html>
