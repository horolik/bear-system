<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Artem vs Production Server 🐻</title>

<style>
body {
 margin: 0;
 font-family: monospace;
 background: black;
 color: #00ff9f;
 overflow: hidden;
}

#matrix {
 position: fixed;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 z-index: 0;
}

#terminal {
 position: fixed;
 inset: 0;
 background: black;
 color: #00ff9f;
 padding: 20px;
 z-index: 10;
 font-size: 14px;
}

#terminalText {
 white-space: pre-line;
}

#inputLine {
 margin-top: 10px;
}

#commandInput {
 background: black;
 border: none;
 color: #00ff9f;
 outline: none;
 font-family: monospace;
}

#app {
 position: relative;
 z-index: 2;
 padding: 20px;
}

#battle {
 margin-top: 20px;
 border: 1px solid #00ff9f55;
 padding: 10px;
}

.card {
 display: inline-block;
 margin: 5px;
 padding: 8px;
 border: 1px solid #00ff9f55;
 cursor: pointer;
 width: 180px;
}

.small {
 font-size: 12px;
 opacity: 0.8;
}

#lore {
 margin-bottom: 10px;
 border: 1px dashed #00ff9f55;
 padding: 10px;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="terminal">
  <div id="terminalText"></div>

  <div id="inputLine" style="display:none;">
    > <input id="commandInput" autocomplete="off" />
  </div>
</div>

<div id="app">

<h1>🐻 Artem vs Production Server</h1>

<div id="lore">
<b>Артём</b> — инженер, который выживает в продакшене, где всё ломается само.<br>
Он не чинит систему. Он её переживает.
</div>

<div id="battle">
  <p>Artem HP: <span id="playerHp">10</span></p>
  <p>Server HP: <span id="enemyHp">20</span></p>
  <p>Mana: <span id="mana">0</span></p>
  <p id="bossState" style="color:#ff4d4d;"></p>

  <hr>

  <div id="hand"></div>

  <button id="endTurn">End Turn</button>
</div>

</div>

<script>

/* ================= MATRIX ================= */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = Array.from({ length: columns }).fill(1);

function matrix(){
 ctx.fillStyle = "rgba(0,0,0,0.05)";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 ctx.fillStyle = "#00ff9f";
 ctx.font = fontSize + "px monospace";

 drops.forEach((y,i)=>{
   const text = letters[Math.floor(Math.random()*letters.length)];
   ctx.fillText(text, i*fontSize, y*fontSize);

   if(y*fontSize > canvas.height && Math.random()>0.975){
     drops[i]=0;
   }
   drops[i]++;
 });
}
setInterval(matrix, 33);

/* ================= GAME STATE ================= */
let playerHp = 10;
let enemyHp = 20;
let mana = 0;
let turn = 1;

let bossMode = false;
let bugLog = 0;
let legacy = 0;

const playerHpEl = document.getElementById("playerHp");
const enemyHpEl = document.getElementById("enemyHp");
const manaEl = document.getElementById("mana");
const hand = document.getElementById("hand");
const endTurn = document.getElementById("endTurn");
const bossState = document.getElementById("bossState");

/* ================= CARDS ================= */
const deck = [
 {
  name:"🐛 Bug Fix",
  cost:1,
  dmg:1,
  desc:"Локальный фикс, который создаёт новый баг"
 },
 {
  name:"🔥 Hotfix",
  cost:2,
  dmg:3,
  desc:"Быстрое исправление без тестов"
 },
 {
  name:"💀 Leak",
  cost:3,
  dmg:5,
  desc:"Память утекает как зарплата после деплоя"
 },
 {
  name:"🔄 Rollback",
  cost:2,
  dmg:2,
  desc:"Откат + новые неожиданные баги"
 }
];

/* ================= START ================= */
function startGame(){
 draw();
 update();
}

/* ================= DRAW ================= */
function draw(){
 hand.innerHTML = "";

 deck.forEach(card=>{

   const el = document.createElement("div");
   el.className = "card";

   el.innerHTML = `
     <b>${card.name}</b><br>
     <span class="small">${card.desc}</span><br>
     Cost: ${card.cost}
   `;

   el.onclick = ()=>play(card);
   hand.appendChild(el);
 });
}

/* ================= BOSS ================= */
function checkBoss(){
 if(enemyHp <= 10 && !bossMode){
   bossMode = true;
   bossState.innerText = "🔥 Production Rage Mode ACTIVATED";
 }
}

/* ================= PLAY ================= */
function play(card){

 if(mana < card.cost) return;
 mana -= card.cost;

 checkBoss();

 // 🧠 legacy grows
 legacy++;

 // 🐛 bug log = shield
 bugLog += Math.floor(card.dmg / 2);

 let damage = card.dmg;

 // 🔥 Rage Mode nerf (НО НЕ СМЕРТЬ)
 if(bossMode){
   damage = Math.max(1, Math.floor(damage * 0.6));
 }

 enemyHp -= damage;

 update();

 if(enemyHp <= 0){
   document.body.innerHTML = `
     <div style="color:#00ff9f;padding:20px;">
       <h1>🎉 VICTORY</h1>
       <p>Артём выжил в Production Rage Mode</p>
       <p>и заставил систему сдаться первой.</p>
     </div>
   `;
 }
}

/* ================= ENEMY ================= */
function enemyTurn(){

 let dmg = 2 + Math.floor(turn/3);

 if(bossMode){
   dmg += 3;
   mana = Math.max(0, mana - 1);
 }

 // 🛡 bug log shield
 let blocked = Math.min(bugLog, dmg);
 dmg -= blocked;
 bugLog -= blocked;

 // 🧠 legacy corruption
 if(legacy > 3){
   dmg += legacy - 3;
 }

 playerHp -= dmg;

 update();

 if(playerHp <= 0){
   document.body.innerHTML = "<h1>💀 GAME OVER</h1>";
 }
}

/* ================= CI/CD EVENT ================= */
function ciCdEvent(){

 const events = [
   "🚨 CI pipeline failed silently",
   "💥 Deploy rolled back randomly",
   "⚠️ Hotfix overwritten by main branch"
 ];

 const event = events[Math.floor(Math.random()*events.length)];
 bossState.innerText = event;

 if(event.includes("rolled back")){
   enemyHp += 3;
 }

 if(event.includes("failed")){
   mana = Math.max(0, mana - 1);
 }
}

/* ================= TURN ================= */
endTurn.onclick = ()=>{

 turn++;
 mana++;

 if(Math.random() < 0.25){
   ciCdEvent();
 }

 enemyTurn();
 draw();
 update();
};

/* ================= UPDATE ================= */
function update(){
 playerHpEl.innerText = playerHp;
 enemyHpEl.innerText = enemyHp;
 manaEl.innerText = mana;
}

startGame();

</script>

</body>
</html>
