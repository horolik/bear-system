<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Bear Debug System 🐻</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: black;
  color: #00ff9f;
  overflow: hidden;
}

/* MATRIX */
#matrix {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* TERMINAL */
#terminal {
  position: fixed;
  inset: 0;
  background: black;
  color: #00ff9f;
  padding: 20px;
  z-index: 3;
  font-size: 14px;
}

#terminalText {
  white-space: pre-line;
}

#inputLine {
  margin-top: 10px;
}

#commandInput {
  background: black;
  border: none;
  color: #00ff9f;
  outline: none;
  font-family: monospace;
}

/* INTRO */
#intro {
  display: none;
  position: fixed;
  inset: 0;
  background: black;
  color: #00ff9f;
  z-index: 4;
  padding: 20px;
}

/* GAME */
#app {
  display: none;
  padding: 20px;
  position: relative;
  z-index: 2;
}

h1 {
  text-shadow: 0 0 10px #00ff9f;
}

/* BUGS */
.bug {
  position: absolute;
  font-size: 22px;
  cursor: pointer;
  z-index: 5;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<!-- TERMINAL -->
<div id="terminal">
  <div id="terminalText"></div>
  <div id="inputLine" style="display:none;">
    > <input id="commandInput" autofocus />
  </div>
</div>

<!-- INTRO -->
<div id="intro">
  <h2>📘 DEBUG TRAINING</h2>

  <pre>
🐻 Bear Debug System

ЭТАПЫ:
1. Лови баги 🐛
2. Получи 5 debug points
3. Запусти систему

Удачи, дев.
  </pre>

  <button id="startBtn">START DEBUG MODE</button>
</div>

<!-- GAME -->
<div id="app">
  <h1>🐻 Bear Debug System</h1>
  <p id="log"></p>
</div>

<script>

/* STATE */
let started = false;
let debugPoints = 0;

/* MATRIX */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = Array.from({ length: columns }).fill(1);

function matrix() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#00ff9f";
  ctx.font = fontSize + "px monospace";

  drops.forEach((y,i)=>{
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, y*fontSize);

    if(y*fontSize > canvas.height && Math.random()>0.975){
      drops[i]=0;
    }
    drops[i]++;
  });
}

setInterval(matrix, 40);

/* TERMINAL */
const terminal = document.getElementById("terminal");
const terminalText = document.getElementById("terminalText");
const input = document.getElementById("commandInput");
const inputLine = document.getElementById("inputLine");

const lines = [
  "Booting Bear System...",
  "Loading modules...",
  "User detected: Артём",
  "Scanning environment...",
  "⚠️ Bugs detected",
  "",
  "Type 'start'"
];

let i = 0;

function typeLine(){
  if(i < lines.length){
    terminalText.innerText += lines[i] + "\n";
    i++;
    setTimeout(typeLine, 500);
  } else {
    inputLine.style.display = "block";
    input.focus();
  }
}
typeLine();

input.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    const cmd = input.value.trim().toLowerCase();
    terminalText.innerText += "> " + cmd + "\n";

    if(cmd === "start"){
      terminal.style.display = "none";
      document.getElementById("intro").style.display = "block";
    } else {
      terminalText.innerText += "command not found\n";
    }

    input.value = "";
  }
});

/* INTRO → BUG MODE */
document.getElementById("startBtn").onclick = ()=>{
  document.getElementById("intro").style.display = "none";
  startBugMode();
};

/* BUG GAME */
function startBugMode(){
  let interval = setInterval(spawnBug, 600);

  function spawnBug(){
    const bug = document.createElement("div");
    bug.className = "bug";
    bug.innerText = "🐛";
    bug.style.left = Math.random()*window.innerWidth + "px";
    bug.style.top = Math.random()*window.innerHeight + "px";

    bug.onclick = ()=>{
      debugPoints++;
      bug.remove();

      if(debugPoints >= 5){
        clearInterval(interval);
        startGame();
      }
    };

    document.body.appendChild(bug);

    setTimeout(()=>bug.remove(), 1500);
  }
}

/* GAME */
function startGame(){
  started = true;
  document.getElementById("app").style.display = "block";
  document.getElementById("log").innerText =
    "👨‍💻 Артём, система стабилизирована. Ты справился.";
}

</script>

</body>
</html>
