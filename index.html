<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Artem vs Production Server 🐻</title>

<style>
body {
 margin: 0;
 font-family: monospace;
 background: black;
 color: #00ff9f;
 overflow: hidden;
}

/* MATRIX */
#matrix {
 position: fixed;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 z-index: 0;
}

/* TERMINAL */
#terminal {
 position: fixed;
 inset: 0;
 background: black;
 color: #00ff9f;
 padding: 20px;
 z-index: 10;
 font-size: 14px;
}

#terminalText {
 white-space: pre-line;
}

#inputLine {
 margin-top: 10px;
}

#commandInput {
 background: black;
 border: none;
 color: #00ff9f;
 outline: none;
 font-family: monospace;
}

/* GAME */
#app {
 position: relative;
 z-index: 2;
 padding: 20px;
}

#battle {
 margin-top: 20px;
 border: 1px solid #00ff9f55;
 padding: 10px;
}

.card {
 display: inline-block;
 margin: 5px;
 padding: 8px;
 border: 1px solid #00ff9f55;
 cursor: pointer;
}

.legendary {
 border: 1px solid gold;
 color: gold;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<!-- TERMINAL -->
<div id="terminal">
  <div id="terminalText"></div>

  <div id="inputLine" style="display:none;">
    > <input id="commandInput" autocomplete="off" />
  </div>
</div>

<!-- GAME -->
<div id="app">
<h1>🐻 Artem vs Production Server</h1>

<div id="battle">
  <p>Artem HP: <span id="playerHp">10</span></p>
  <p>Server HP: <span id="enemyHp">20</span></p>
  <p>Mana: <span id="mana">0</span></p>

  <hr>

  <div id="hand"></div>

  <button id="endTurn">End Turn</button>
</div>
</div>

<script>
/* ================= MATRIX ================= */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = Array.from({ length: columns }).fill(1);

function matrix(){
 ctx.fillStyle = "rgba(0,0,0,0.05)";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 ctx.fillStyle = "#00ff9f";
 ctx.font = fontSize + "px monospace";

 drops.forEach((y,i)=>{
   const text = letters[Math.floor(Math.random()*letters.length)];
   ctx.fillText(text, i*fontSize, y*fontSize);

   if(y*fontSize > canvas.height && Math.random()>0.975){
     drops[i]=0;
   }
   drops[i]++;
 });
}
setInterval(matrix, 33);

/* ================= TERMINAL ================= */
const terminal = document.getElementById("terminal");
const terminalText = document.getElementById("terminalText");
const input = document.getElementById("commandInput");
const inputLine = document.getElementById("inputLine");

const lines = [
 "Booting Artem System...",
 "Loading modules...",
 "Detecting user: Артём",
 "Connecting to Production Server...",
 "⚠️ Critical bugs detected",
 "",
 "Type 'start' to begin"
];

let i = 0;

function type(){
 if(i < lines.length){
   terminalText.innerText += lines[i] + "\n";
   i++;
   setTimeout(type, 500);
 } else {
   inputLine.style.display = "block";
   input.focus();
 }
}
type();

input.addEventListener("keydown", e=>{
 if(e.key === "Enter"){
   const cmd = input.value.trim().toLowerCase();

   terminalText.innerText += "> " + cmd + "\n";

   if(cmd === "start"){
     terminalText.innerText += "Launching...\n";

     setTimeout(()=>{
       terminal.style.display = "none";
       startGame();
     }, 800);
   } else {
     terminalText.innerText += "command not found\n";
   }

   input.value = "";
 }
});

/* ================= GAME ================= */
let playerHp = 10;
let enemyHp = 20;
let mana = 0;
let turn = 1;

const playerHpEl = document.getElementById("playerHp");
const enemyHpEl = document.getElementById("enemyHp");
const manaEl = document.getElementById("mana");
const hand = document.getElementById("hand");
const endTurn = document.getElementById("endTurn");

const deck = [
 { name:"🐛 Bug Fix", cost:1, dmg:1 },
 { name:"🔥 Hotfix", cost:2, dmg:3 },
 { name:"💀 Leak", cost:3, dmg:5 },
 { name:"🔄 Rollback", cost:2, dmg:2 },
 { name:"💙 From Dev Who Cares", cost:0, dmg:999, secret:true }
];

function startGame(){
 draw();
 update();
}

function draw(){
 hand.innerHTML = "";

 deck.forEach(card=>{

   if(card.secret && playerHp > 5) return;

   const el = document.createElement("div");
   el.className = "card";

   if(card.secret){
     el.innerText = "???";
     el.style.border = "1px solid #ff4da6";
     el.style.color = "#ff4da6";
   } else {
     el.innerText = `${card.name} (${card.cost})`;
   }

   el.onclick = ()=>play(card);
   hand.appendChild(el);
 });
}

function play(card){
 if(mana < card.cost) return;

 mana -= card.cost;

 if(card.secret){
   document.body.innerHTML = `
     <div style="color:#ff4da6;padding:20px;font-family:monospace;">
       <h1>💙 SECRET CARD</h1>
       <p>Artem...</p>
       <p>ты справился.</p>
       <p>и это важнее любого деплоя.</p>
       <p>— твой dev 🐻</p>
     </div>
   `;
   return;
 }

 enemyHp -= card.dmg;
 update();

 if(enemyHp <= 0){
   document.body.innerHTML = "<h1>🎉 VICTORY</h1>";
 }
}

function enemyTurn(){
 playerHp -= 2 + Math.floor(turn/3);
 update();

 if(playerHp <= 0){
   document.body.innerHTML = "<h1>💀 GAME OVER</h1>";
 }
}

endTurn.onclick = ()=>{
 turn++;
 mana++;

 enemyTurn();
 draw();
 update();
};

function update(){
 playerHpEl.innerText = playerHp;
 enemyHpEl.innerText = enemyHp;
 manaEl.innerText = mana;
}
</script>

</body>
</html>
